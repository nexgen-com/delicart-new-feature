<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客管理 - ショップ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-main': '#FFFBEA',
                        'primary': '#F17225',
                        'accent': '#FFB347',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg-main min-h-screen">
    <!-- Sidebar -->
    <div class="fixed inset-y-0 left-0 w-64 bg-white shadow-lg">
        <div class="h-full flex flex-col">
            <div class="h-20 py-4 px-6 border-b flex items-center">
                <h1 class="text-2xl font-bold text-primary">Delicart Lunch</h1>
            </div>
            <nav class="flex-1 py-4 px-6 space-y-2">
                <a href="shop-dashboard.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-chart-line mr-3"></i>
                    Dashboard
                </a>
                <a href="shop-products-list.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-box mr-3"></i>
                    商品
                </a>
                <a href="shop-orders-list.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-shopping-cart mr-3"></i>
                    注文
                </a>
                <a href="shop-customers-list.html" class="flex items-center px-4 py-3 text-white bg-primary rounded-lg">
                    <i class="fas fa-users mr-3"></i>
                    顧客
                </a>
                <a href="shop-profile-settings.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-cog mr-3"></i>
                    設定
                </a>
                <a href="shop-notice-list.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-bullhorn mr-3"></i>
                    お知らせ
                </a>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="ml-64">
        <!-- Header -->
        <header class="bg-white border-b">
            <div class="h-20 px-8 py-4 flex items-center justify-end">
                <!-- Dropdown profile -->
                <div class="relative" id="profileDropdown">
                    <button onclick="toggleProfileDropdown()" class="flex items-center space-x-2 focus:outline-none">
                        <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-semibold">
                            S
                        </div>
                        <span class="text-gray-700 font-medium">Shop ABC</span>
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="profileMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
                        <a href="#" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-user-edit mr-2"></i>プロフィール更新</a>
                        <a href="#" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-key mr-2"></i>パスワード変更</a>
                        <a href="login.html" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-right-from-bracket mr-2"></i>ログアウト</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="p-8">
            <!-- Filter Section -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">検索</label>
                        <input 
                            type="text" 
                            placeholder="名前、メールアドレス、電話番号..."
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none"
                        >
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">顧客グループ</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                            <option value="">すべて</option>
                            <option value="vip">VIP</option>
                            <option value="regular">通常</option>
                            <option value="new">新規</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button class="w-full bg-primary text-white px-4 py-2 rounded-lg hover:bg-opacity-90 transition">
                            検索
                        </button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">顧客名</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">メールアドレス</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">電話番号</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">注文総数</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">作成日</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">1</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Nguyễn Văn A</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">nguyenvana@email.com</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">0901234567</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">12</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">01/01/2024</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <a href="shop-customers-edit.html" class="text-gray-700 hover:text-opacity-80 mr-3"><i class="fas fa-edit mr-1"></i>編集</a>
                                    <button class="text-red-600 hover:text-opacity-80"><i class="fas fa-trash mr-1"></i>削除</button>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">2</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Trần Thị B</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">tranthib@email.com</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">0907654321</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">8</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">05/01/2024</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <a href="shop-customers-edit.html" class="text-gray-700 hover:text-opacity-80 mr-3"><i class="fas fa-edit mr-1"></i>編集</a>
                                    <button class="text-red-600 hover:text-opacity-80"><i class="fas fa-trash mr-1"></i>削除</button>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">3</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Lê Văn C</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">levanc@email.com</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">0912345678</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">5</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">10/01/2024</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <a href="shop-customers-edit.html" class="text-gray-700 hover:text-opacity-80 mr-3"><i class="fas fa-edit mr-1"></i>編集</a>
                                    <button class="text-red-600 hover:text-opacity-80"><i class="fas fa-trash mr-1"></i>削除</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                    <div class="text-sm text-gray-500">
                        表示 <span class="font-medium">1</span> から <span class="font-medium">10</span> の <span class="font-medium">89</span> 顧客
                    </div>
                    <div class="flex space-x-2">
                        <button class="px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">前へ</button>
                        <button class="px-3 py-2 bg-primary text-white rounded-lg text-sm">1</button>
                        <button class="px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">2</button>
                        <button class="px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">3</button>
                        <button class="px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">次へ</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleProfileDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('hidden');
        }

        function closeProfileDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.add('hidden');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('profileDropdown');
            const menu = document.getElementById('profileMenu');
            if (!dropdown.contains(event.target) && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
