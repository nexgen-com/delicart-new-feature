<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F17225">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Delicart Lunch">
    <meta name="description" content="Delicart Lunch Management System">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>ショップ編集 - Administrator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-main': '#FFFBEA',
                        'primary': '#F17225',
                        'accent': '#FFB347',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg-main min-h-screen">
    <!-- Mobile Overlay -->
    <div id="mobileOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" onclick="toggleSidebar()"></div>
    
    <!-- Sidebar -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white shadow-lg transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out z-50">
        <div class="h-full flex flex-col">
            <div class="h-20 py-4 px-6 border-b flex items-center">
                <h1 class="text-2xl font-bold text-primary">Delicart Lunch</h1>
            </div>
            <nav class="flex-1 py-4 px-6 space-y-2">
                <a href="admin-dashboard.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-chart-line mr-3"></i>
                    Dashboard
                </a>
                <a href="admin-shops-list.html" class="flex items-center px-4 py-3 text-white bg-primary rounded-lg">
                    <i class="fas fa-store mr-3"></i>
                    ショップ管理
                </a>
                <a href="admin-notice-list.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-bullhorn mr-3"></i>
                    お知らせ
                </a>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="lg:ml-64">
        <!-- Header -->
        <header class="bg-white border-b">
            <div class="h-20 px-4 lg:px-8 py-4 flex items-center justify-between lg:justify-end">
                <!-- Mobile Menu Button -->
                <button onclick="toggleSidebar()" class="lg:hidden p-2 text-gray-600 hover:text-primary focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <!-- Dropdown profile -->
                <div class="relative" id="profileDropdown">
                    <button onclick="toggleProfileDropdown()" class="flex items-center space-x-2 focus:outline-none">
                        <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-semibold">
                            A
                        </div>
                        <span class="text-gray-700 font-medium">Administrator</span>
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="profileMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
                        <a href="#" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-user-edit mr-2"></i>プロフィール更新</a>
                        <a href="#" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-key mr-2"></i>パスワード変更</a>
                        <a href="login.html" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-right-from-bracket mr-2"></i>ログアウト</a>
                    </div>
                </div>
            </div>
        </header>


        <!-- Content -->
        <main class="p-4 lg:p-8">
            <div class="mb-6 flex justify-between items-center"><h2 class="text-2xl font-bold text-gray-800">ショップ情報を更新</h2></div>
            <div class="bg-white rounded-lg shadow-md p-8"><form class="space-y-6"><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label for="input-s7druo9pi" class="block text-sm font-medium text-gray-700 mb-2">ショップ名 <span class="text-red-500">*</span></label><input id="input-s7druo9pi" type="text" placeholder="ショップ名を入力" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition border-gray-300" value="Delicious Ramen Shop"><!--v-if--></div><div><label for="input-y8hx7aujs" class="block text-sm font-medium text-gray-700 mb-2">Email <span class="text-red-500">*</span></label><input id="input-y8hx7aujs" type="email" placeholder="example@email.com" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition border-gray-300" value="shop1@obento-delicart.net"><!--v-if--></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label for="input-z9bv5zdx1" class="block text-sm font-medium text-gray-700 mb-2">電話番号 <!--v-if--></label><input id="input-z9bv5zdx1" type="tel" placeholder="0123456789" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition border-gray-300" value="0901234567"><!--v-if--></div><div><label for="input-ar0wkvtxk" class="block text-sm font-medium text-gray-700 mb-2">パスワード <!--v-if--></label><input id="input-ar0wkvtxk" type="password" placeholder="変更する場合のみ入力" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition border-gray-300" value=""><!--v-if--></div></div><div class="flex flex-wrap items-center gap-6"><div class="flex items-center cursor-pointer hover:opacity-80 transition"><input id="status" type="checkbox" checked="" class="w-6 h-6 text-primary border-gray-300 rounded-md focus:ring-primary cursor-pointer"><label for="status" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer"> アクティブ </label></div><div class="flex items-center cursor-pointer hover:opacity-80 transition"><input id="allow_debit" type="checkbox" class="w-6 h-6 text-primary border-gray-300 rounded-md focus:ring-primary cursor-pointer"><label for="allow_debit" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer"> 月末支払いを許可 </label></div><div class="flex items-center cursor-pointer hover:opacity-80 transition"><input id="allow_online_payment" type="checkbox" class="w-6 h-6 text-primary border-gray-300 rounded-md focus:ring-primary cursor-pointer"><label for="allow_online_payment" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer"> オンライン決済を許可 </label></div></div><!--v-if--><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label for="input-e9ubnvohn" class="block text-sm font-medium text-gray-700 mb-2">住所 <!--v-if--></label><input id="input-e9ubnvohn" type="text" placeholder="住所 shop" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition border-gray-300" value="123 Main Street, Shibuya"><!--v-if--></div><div><label for="input-erinl4fzd" class="block text-sm font-medium text-gray-700 mb-2">市区町村 <!--v-if--></label><input id="input-erinl4fzd" type="text" placeholder="市区町村" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition border-gray-300" value="Tokyo"><!--v-if--></div></div><div><label for="input-co6eod2zd" class="block text-sm font-medium text-gray-700 mb-2">説明 <!--v-if--></label><textarea id="input-co6eod2zd" placeholder="" rows="4" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition resize-none border-gray-300" value="Authentic Japanese ramen shop serving traditional flavors."></textarea><!--v-if--></div><div class="flex justify-end space-x-4 pt-4"><a type="button" disabled="false" class="inline-flex items-center justify-center rounded-lg transition font-medium px-6 py-3 text-base border border-gray-300 text-gray-700 hover:bg-gray-50" href="/admin/shops/2"><i class="fas fa-eye mr-2"></i><!--v-if--> 詳細 </a><a type="button" disabled="false" class="inline-flex items-center justify-center rounded-lg transition font-medium px-6 py-3 text-base border border-gray-300 text-gray-700 hover:bg-gray-50" href="/admin/shops"><i class="fas fa-arrow-left mr-2"></i><!--v-if--> キャンセル </a><button type="submit" class="inline-flex items-center justify-center rounded-lg transition font-medium px-6 py-3 text-base bg-primary text-white hover:bg-opacity-90"><i class="fas fa-save mr-2"></i><!--v-if--> 変更を保存 </button></div></form></div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function toggleProfileDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('hidden');
        }

        function closeProfileDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.add('hidden');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('profileDropdown');
            const menu = document.getElementById('profileMenu');
            if (!dropdown.contains(event.target) && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
