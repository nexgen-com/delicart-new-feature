<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F17225">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Delicart Lunch">
    <meta name="description" content="Delicart Lunch Management System">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>ショップ詳細 - Administrator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-main': '#FFFBEA',
                        'primary': '#F17225',
                        'accent': '#FFB347',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg-main min-h-screen">
    <!-- Mobile Overlay -->
    <div id="mobileOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" onclick="toggleSidebar()"></div>
    
    <!-- Sidebar -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white shadow-lg transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out z-50">
        <div class="h-full flex flex-col">
            <div class="h-20 py-4 px-6 border-b flex items-center">
                <h1 class="text-2xl font-bold text-primary">Delicart Lunch</h1>
            </div>
            <nav class="flex-1 py-4 px-6 space-y-2">
                <a href="admin-dashboard.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-chart-line mr-3"></i>
                    Dashboard
                </a>
                <a href="admin-shops-list.html" class="flex items-center px-4 py-3 text-white bg-primary rounded-lg">
                    <i class="fas fa-store mr-3"></i>
                    ショップ管理
                </a>
                <a href="admin-notice-list.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-bullhorn mr-3"></i>
                    お知らせ
                </a>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="lg:ml-64">
        <!-- Header -->
        <header class="bg-white border-b">
            <div class="h-20 px-4 lg:px-8 py-4 flex items-center justify-between lg:justify-end">
                <!-- Mobile Menu Button -->
                <button onclick="toggleSidebar()" class="lg:hidden p-2 text-gray-600 hover:text-primary focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <div class="relative" id="profileDropdown">
                    <button onclick="toggleProfileDropdown()" class="flex items-center space-x-2 focus:outline-none">
                        <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-semibold">
                            A
                        </div>
                        <span class="text-gray-700 font-medium">Administrator</span>
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="profileMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
                        <a href="#" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-user-edit mr-2"></i>プロフィール更新</a>
                        <a href="#" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-key mr-2"></i>パスワード変更</a>
                        <a href="login.html" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-right-from-bracket mr-2"></i>ログアウト</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="p-4 lg:p-8">
            <div class="bg-white rounded-lg shadow-md p-5"><div class="mb-3 pb-3"><h3 class="text-2xl font-bold text-gray-800 mb-2">Delicious Ramen Shop</h3><span class="px-3 py-1 text-sm font-semibold rounded-full bg-green-100 text-green-800">アクティブ</span></div><div class="space-y-4 mb-6"><div class="flex items-start py-3 border-b border-gray-200"><label class="w-32 text-base font-medium text-gray-500 flex-shrink-0">店舗コード</label><p class="text-base text-gray-800 flex-1">SHOP3271</p></div><div class="flex items-start py-3 border-b border-gray-200"><label class="w-32 text-base font-medium text-gray-500 flex-shrink-0">Email</label><p class="text-base text-gray-800 flex-1">shop1@obento-delicart.net</p></div><div class="flex items-start py-3 border-b border-gray-200"><label class="w-32 text-base font-medium text-gray-500 flex-shrink-0">電話番号</label><p class="text-base text-gray-800 flex-1">0901234567</p></div><div class="flex items-start py-3 border-b border-gray-200"><label class="w-32 text-base font-medium text-gray-500 flex-shrink-0">作成日時</label><p class="text-base text-gray-800 flex-1">2025/11/24 05:23</p></div><div class="flex items-start py-3 border-b border-gray-200"><label class="w-32 text-base font-medium text-gray-500 flex-shrink-0">月末支払い許可</label><div class="flex-1"><span class="px-3 py-1 text-sm font-semibold rounded-full bg-gray-100 text-gray-800">不許可</span></div></div><div class="flex items-start py-3 border-b border-gray-200"><label class="w-32 text-base font-medium text-gray-500 flex-shrink-0">オンライン決済許可</label><div class="flex-1"><span class="px-3 py-1 text-sm font-semibold rounded-full bg-gray-100 text-gray-800">不許可</span></div></div><div class="flex items-start py-3 border-b border-gray-200"><label class="w-32 text-base font-medium text-gray-500 flex-shrink-0">住所</label><p class="text-base text-gray-800 flex-1">123 Main Street, Shibuya</p></div><div class="flex items-start py-3 border-b border-gray-200"><label class="w-32 text-base font-medium text-gray-500 flex-shrink-0">説明</label><p class="text-base text-gray-800 flex-1">Authentic Japanese ramen shop serving traditional flavors.</p></div></div><!-- Stats --><div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-6"><div class="bg-gray-50 rounded-lg p-4"><p class="text-sm text-gray-500 mb-1">注文総数</p><p class="text-2xl font-bold text-primary">0</p></div><div class="bg-gray-50 rounded-lg p-4"><p class="text-sm text-gray-500 mb-1">顧客総数</p><p class="text-2xl font-bold text-primary">0</p></div><div class="bg-gray-50 rounded-lg p-4"><p class="text-sm text-gray-500 mb-1">商品総数</p><p class="text-2xl font-bold text-primary">0</p></div></div><!-- Action Buttons --><div class="flex justify-end space-x-4 pt-4 mt-6"><a class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition" href="/admin/shops"><i class="fas fa-arrow-left mr-1"></i>戻る </a><a class="px-6 py-3 bg-accent text-white rounded-lg hover:bg-opacity-90 transition" href="/admin-shops-edit.html"><i class="fas fa-edit mr-1"></i>編集 </a></div></div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function toggleProfileDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('hidden');
        }

        function closeProfileDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.add('hidden');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('profileDropdown');
            const menu = document.getElementById('profileMenu');
            if (!dropdown.contains(event.target) && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });
            // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
