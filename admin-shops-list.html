<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F17225">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Delicart Lunch">
    <meta name="description" content="Delicart Lunch Management System">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>ショップ管理 - 管理者</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-main': '#FFFBEA',
                        'primary': '#F17225',
                        'accent': '#FFB347',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg-main min-h-screen">
    <!-- Mobile Overlay -->
    <div id="mobileOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden" onclick="toggleSidebar()"></div>
    
    <!-- Sidebar -->
    <!-- Sidebar -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white shadow-lg transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out z-50">
        <div class="h-full flex flex-col">
            <div class="h-20 py-4 px-6 border-b flex items-center">
                <h1 class="text-2xl font-bold text-primary">Delicart Lunch</h1>
            </div>
            <nav class="flex-1 py-4 px-6 space-y-2">
                <a href="admin-dashboard.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-chart-line mr-3"></i>
                    Dashboard
                </a>
                <a href="admin-shops-list.html" class="flex items-center px-4 py-3 text-white bg-primary rounded-lg">
                    <i class="fas fa-store mr-3"></i>
                    ショップ管理
                </a>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="lg:ml-64">
        <!-- Header -->
        <header class="bg-white border-b">
            <div class="h-20 px-4 lg:px-8 py-4 flex items-center justify-between lg:justify-end">
                <!-- Mobile Menu Button -->
                <button onclick="toggleSidebar()" class="lg:hidden p-2 text-gray-600 hover:text-primary focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <!-- Dropdown profile -->
                <div class="relative" id="profileDropdown">
                    <button onclick="toggleProfileDropdown()" class="flex items-center space-x-2 focus:outline-none">
                        <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-semibold">
                            A
                        </div>
                        <span class="text-gray-700 font-medium">Administrator</span>
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="profileMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
                        <a href="#" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-user-edit mr-2"></i>プロフィール更新</a>
                        <a href="#" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-key mr-2"></i>パスワード変更</a>
                        <a href="login.html" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-right-from-bracket mr-2"></i>ログアウト</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="p-4 lg:p-8">
            <!-- Header with Add Button -->
            <div class="mb-6 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">ショップ管理</h2>

                <a type="button" disabled="false" class="inline-flex items-center justify-center rounded-lg transition font-medium px-4 py-2 text-sm bg-primary text-white hover:bg-opacity-90" href="/admin/shops/create"><i class="fas fa-plus mr-2"></i><!--v-if--> ショップ追加 </a>
            </div>
            
            <!-- Filter Section -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6"><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div><label for="input-xwa598plx" class="block text-sm font-medium text-gray-700 mb-2">検索 <!--v-if--></label><input id="input-xwa598plx" type="text" placeholder="ショップ名、メールアドレス..." class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition border-gray-300" value=""><!--v-if--></div><div><label for="select-vweyrnnmk" class="block text-sm font-medium text-gray-700 mb-2">状態 <!--v-if--></label><select id="select-vweyrnnmk" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition border-gray-300" value=""><!--v-if--><option value="">すべて</option><option value="active">アクティブ</option><option value="inactive">一時停止</option></select><!--v-if--></div><div class="flex items-end gap-2"><button type="button" class="inline-flex items-center justify-center rounded-lg transition font-medium px-4 py-2 text-sm bg-primary text-white hover:bg-opacity-90 !py-3 flex-1"><i class="fas fa-search mr-2"></i><!--v-if--> 検索 </button><button type="button" class="inline-flex items-center justify-center rounded-lg transition font-medium px-4 py-2 text-sm border border-gray-300 text-gray-700 hover:bg-gray-50 !py-3"><i class="fas fa-times mr-2"></i><!--v-if--> クリア </button></div></div></div>

            <!-- Table -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">ショップ名</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">メールアドレス</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">状態</th>
                                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">作成日</th>
                                <th class="px-2 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap" style="width: 120px;">操作</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">1</td>
                                <td class="px-6 py-4 text-sm">
                                    <div class="font-medium text-gray-900">Shop ABC</div>
                                    <button class="text-blue-600 hover:text-opacity-80 mt-1 text-xs">プロキシログイン</button>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">abc@example.com</td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">アクティブ</span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">01/01/2024</td>
                                <td class="px-2 py-4 whitespace-nowrap text-sm font-medium" style="width: 120px;">
                                    <a href="admin-shops-detail.html" class="text-blue-600 hover:text-opacity-80 mr-3"><i class="fas fa-eye mr-1"></i>詳細</a>
                                    <a href="admin-shops-edit.html" class="text-gray-700 hover:text-opacity-80 mr-3"><i class="fas fa-edit mr-1"></i>編集</a>
                                    <button class="text-red-600 hover:text-opacity-80 mr-3"><i class="fas fa-trash mr-1"></i>削除</button>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">2</td>
                                <td class="px-6 py-4 text-sm">
                                    <div class="font-medium text-gray-900">Shop XYZ</div>
                                    <button class="text-blue-600 hover:text-opacity-80 mt-1 text-xs">プロキシログイン</button>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">xyz@example.com</td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">アクティブ</span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">02/01/2024</td>
                                <td class="px-2 py-4 whitespace-nowrap text-sm font-medium" style="width: 120px;">
                                    <a href="admin-shops-detail.html" class="text-blue-600 hover:text-opacity-80 mr-3"><i class="fas fa-eye mr-1"></i>詳細</a>
                                    <a href="admin-shops-edit.html" class="text-gray-700 hover:text-opacity-80 mr-3"><i class="fas fa-edit mr-1"></i>編集</a>
                                    <button class="text-red-600 hover:text-opacity-80 mr-3"><i class="fas fa-trash mr-1"></i>削除</button>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">3</td>
                                <td class="px-6 py-4 text-sm">
                                    <div class="font-medium text-gray-900">Shop 123</div>
                                    <button class="text-blue-600 hover:text-opacity-80 mt-1 text-xs">プロキシログイン</button>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">shop123@example.com</td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span class="px-2 py-1 text-xs font-semibold rounded-full bg-yellow-100 text-yellow-800">一時停止</span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">03/01/2024</td>
                                <td class="px-2 py-4 whitespace-nowrap text-sm font-medium" style="width: 120px;">
                                    <a href="admin-shops-detail.html" class="text-blue-600 hover:text-opacity-80 mr-3"><i class="fas fa-eye mr-1"></i>詳細</a>
                                    <a href="admin-shops-edit.html" class="text-gray-700 hover:text-opacity-80 mr-3"><i class="fas fa-edit mr-1"></i>編集</a>
                                    <button class="text-red-600 hover:text-opacity-80 mr-3"><i class="fas fa-trash mr-1"></i>削除</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                    <div class="text-sm text-gray-500">
                        表示 <span class="font-medium">1</span> から <span class="font-medium">10</span> の <span class="font-medium">125</span> ショップ
                    </div>
                    <div class="flex space-x-2">
                        <button class="px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">前へ</button>
                        <button class="px-3 py-2 bg-primary text-white rounded-lg text-sm">1</button>
                        <button class="px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">2</button>
                        <button class="px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">3</button>
                        <button class="px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">次へ</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function toggleProfileDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('hidden');
        }

        function closeProfileDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.add('hidden');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('profileDropdown');
            const menu = document.getElementById('profileMenu');
            if (!dropdown.contains(event.target) && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });
            // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
