<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Thêm Đơn hàng - Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-main': '#FFFBEA',
                        'primary': '#F17225',
                        'accent': '#FFB347',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg-main min-h-screen">
    <!-- Sidebar -->
    <div class="fixed inset-y-0 left-0 w-64 bg-white shadow-lg">
        <div class="h-full flex flex-col">
            <div class="h-20 py-4 px-6 border-b flex items-center">
                <h1 class="text-2xl font-bold text-primary">Delicart Lunch</h1>
            </div>
            <nav class="flex-1 py-4 px-6 space-y-2">
                <a href="shop-dashboard.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-chart-line mr-3"></i>
                    Dashboard
                </a>
                <a href="shop-products-list.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-box mr-3"></i>
                    Sản phẩm
                </a>
                <a href="shop-orders-list.html" class="flex items-center px-4 py-3 text-white bg-primary rounded-lg">
                    <i class="fas fa-shopping-cart mr-3"></i>
                    Đơn hàng
                </a>
                <a href="shop-customers-list.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-users mr-3"></i>
                    Khách hàng
                </a>
                <a href="shop-profile-settings.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-cog mr-3"></i>
                    Cài đặt
                </a>
                <a href="shop-notice-list.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-bullhorn mr-3"></i>
                    Thông báo
                </a>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="ml-64">
        <!-- Header -->
        <header class="bg-white border-b">
            <div class="h-20 px-8 py-4 flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="shop-orders-list.html" class="text-gray-600 hover:text-primary"><i class="fas fa-arrow-left mr-1"></i>Quay lại</a>
                </div>
                <!-- Dropdown profile -->
                <div class="relative" id="profileDropdown">
                    <button onclick="toggleProfileDropdown()" class="flex items-center space-x-2 focus:outline-none">
                        <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-semibold">
                            S
                        </div>
                        <span class="text-gray-700 font-medium">Shop ABC</span>
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="profileMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
                        <a href="#" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-user-edit mr-2"></i>Cập nhật profile</a>
                        <a href="#" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-key mr-2"></i>Đổi mật khẩu</a>
                        <a href="login.html" onclick="closeProfileDropdown()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100"><i class="fas fa-right-from-bracket mr-2"></i>Đăng xuất</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <main class="p-8">
            <div class="bg-white rounded-lg shadow-md p-8 max-w-3xl">
                <form class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Khách hàng *</label>
                        <select required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                            <option value="">Chọn khách hàng</option>
                            <option value="1">Nguyễn Văn A</option>
                            <option value="2">Trần Thị B</option>
                            <option value="3">Lê Văn C</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Sản phẩm *</label>
                        <div class="space-y-3">
                            <div class="flex items-center space-x-3 p-3 border border-gray-300 rounded-lg">
                                <select class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                                    <option value="">Chọn sản phẩm</option>
                                    <option value="1">Bánh mì thịt nướng - 25,000 đ</option>
                                    <option value="2">Cà phê đen - 15,000 đ</option>
                                </select>
                                <input 
                                    type="number" 
                                    placeholder="Số lượng"
                                    min="1"
                                    class="w-24 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none"
                                >
                                <button type="button" class="px-4 py-2 bg-accent text-white rounded-lg hover:bg-opacity-90">
                                    Thêm
                                </button>
                            </div>
                        </div>
                        <button type="button" class="mt-2 text-sm text-primary hover:underline">+ Thêm sản phẩm khác</button>
                    </div>

                    <div class="border-t pt-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-gray-700">Tạm tính:</span>
                            <span class="font-semibold">0 đ</span>
                        </div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-gray-700">Phí giao hàng:</span>
                            <span class="font-semibold">30,000 đ</span>
                        </div>
                        <div class="flex justify-between items-center text-lg font-bold border-t pt-2">
                            <span>Tổng tiền:</span>
                            <span class="text-primary">30,000 đ</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Địa chỉ giao hàng *</label>
                        <input 
                            type="text" 
                            required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none"
                            placeholder="Nhập địa chỉ giao hàng"
                        >
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Phương thức thanh toán *</label>
                            <select required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                                <option value="">Chọn phương thức</option>
                                <option value="cod">COD</option>
                                <option value="bank">Chuyển khoản</option>
                                <option value="ewallet">Ví điện tử</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Trạng thái *</label>
                            <select required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none">
                                <option value="pending">Chờ xử lý</option>
                                <option value="processing">Đang xử lý</option>
                                <option value="completed">Hoàn thành</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Ghi chú</label>
                        <textarea 
                            rows="3"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none"
                            placeholder="Ghi chú đơn hàng"
                        ></textarea>
                    </div>

                    <div class="flex justify-end space-x-4 pt-4 border-t">
                        <a href="shop-orders-list.html" class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                            Hủy
                        </a>
                        <button type="submit" class="px-6 py-3 bg-primary text-white rounded-lg hover:bg-opacity-90 transition">
                            Tạo Đơn hàng
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        function toggleProfileDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('hidden');
        }

        function closeProfileDropdown() {
            const menu = document.getElementById('profileMenu');
            menu.classList.add('hidden');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('profileDropdown');
            const menu = document.getElementById('profileMenu');
            if (!dropdown.contains(event.target) && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
